<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Pick your favorite currencies, type an amount in one, and see it converted to all the others.">
  <title>Currency Converter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7b5f'/%3E%3Cpath d='M9 12h12l-3-3M23 20H11l3 3' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Currency Converter</h1>
      <p class="lede">Type an amount in any currency. The others update as you type.</p>
    </header>

    <section aria-label="Favorite currencies">
      <ul id="rows" class="rows"></ul>
      <p id="empty" class="empty" hidden>No favorites yet. Add a currency to start converting.</p>
      <button id="add" class="add" type="button">
        <span aria-hidden="true">+</span> Add currency
      </button>
    </section>

    <footer class="status">
      <span id="status" role="status" aria-live="polite"></span>
      <button id="refresh" class="link" type="button">Refresh</button>
    </footer>
  </main>

  <dialog id="picker" class="picker" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 id="picker-title">Currencies</h2>
      <button id="picker-close" class="done" type="button">Done</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Search by code or name"
           aria-label="Search currencies" autocomplete="off" spellcheck="false">
    <ul id="options" class="options"></ul>
    <p id="no-match" class="empty" hidden>No currency matches that search.</p>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
